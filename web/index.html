<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>famagic · Familienliste</title>
<style>
:root {
  --bg: #141414;
  --card: #1d1d1d;
  --card2: #242424;
  --line: #2e2e2e;
  --text: #ececec;
  --muted: #9a9a9a;
  --dim: #6f6f6f;
  --accent: #e8a13a;
  --accent-dim: #4a3517;
  --danger: #d96a5a;
  --ok: #7fae6f;
  --radius: 10px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
}
header {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: 12px 16px 0;
}
.brand {
  display: flex; align-items: baseline; gap: 10px; justify-content: space-between;
}
.brand h1 {
  margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
  color: var(--accent);
}
.brand .family { font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--dim); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.dot.err { background: var(--danger); }
.dot.pending { background: var(--accent); }
.dot.sync { background: var(--accent); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.tabs {
  display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 8px; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: transparent; color: var(--muted);
  padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; white-space: nowrap;
}
.tab.active { color: #141414; background: var(--accent); border-color: var(--accent); font-weight: 600; }
main { flex: 1; padding: 4px 16px 120px; max-width: 720px; width: 100%; margin: 0 auto; }
section h2 {
  font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim);
  margin: 18px 0 6px; font-weight: 600;
}
.task {
  display: flex; align-items: flex-start; gap: 12px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px; margin-bottom: 8px; cursor: pointer;
}
.task:active { background: var(--card2); }
.check {
  flex: 0 0 auto; width: 22px; height: 22px; margin-top: 1px; border-radius: 50%;
  border: 1.5px solid #555; background: transparent; cursor: pointer; position: relative;
}
.check.on { background: var(--accent); border-color: var(--accent); }
.check.on::after {
  content: ""; position: absolute; left: 6px; top: 3px; width: 6px; height: 10px;
  border: solid #141414; border-width: 0 2px 2px 0; transform: rotate(45deg);
}
.task .body { flex: 1; min-width: 0; }
.task .title { overflow-wrap: anywhere; }
.task.done .title { color: var(--dim); text-decoration: line-through; }
.task .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; font-size: 12px; color: var(--muted); }
.chip {
  border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; white-space: nowrap;
  font-size: 11px; color: var(--muted); background: #191919;
}
.chip.due-today { color: var(--accent); border-color: #5a421c; }
.chip.due-overdue { color: var(--danger); border-color: #5a2a24; }
.chip.prio { color: var(--accent); border-color: #5a421c; }
.addbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: linear-gradient(transparent, var(--bg) 30%);
  padding: 20px 16px calc(14px + env(safe-area-inset-bottom));
}
.addwrap {
  max-width: 720px; margin: 0 auto; display: flex; gap: 8px;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px;
}
.addwrap input {
  flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--text);
  font-size: 15px; padding: 8px 10px;
}
.addwrap button {
  border: 0; background: var(--accent); color: #141414; font-weight: 700; border-radius: 8px;
  padding: 0 16px; font-size: 20px; cursor: pointer;
}
.empty { color: var(--dim); font-size: 13px; padding: 8px 2px; }
.more {
  background: none; border: 0; color: var(--dim); font-size: 12px; cursor: pointer;
  letter-spacing: .1em; text-transform: uppercase; padding: 6px 0;
}
.sheet-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20; display: none;
  align-items: flex-end; justify-content: center;
}
.sheet-bg.open { display: flex; }
.sheet {
  width: 100%; max-width: 720px; background: var(--card); border-radius: 16px 16px 0 0;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line);
  max-height: 92dvh; overflow-y: auto;
}
.sheet h3 { margin: 0 0 12px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.field { margin-bottom: 10px; }
.field label { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; }
.field input, .field textarea, .field select {
  width: 100%; background: #191919; border: 1px solid var(--line); border-radius: 8px;
  color: var(--text); font-size: 15px; padding: 9px 10px; outline: none; font-family: inherit;
}
.field textarea { min-height: 72px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions { display: flex; gap: 8px; margin-top: 14px; }
.btn {
  flex: 1; border: 1px solid var(--line); background: var(--card2); color: var(--text);
  border-radius: 9px; padding: 11px; font-size: 14px; cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: #141414; font-weight: 700; }
.btn.danger { color: var(--danger); border-color: #4a2620; }
.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  background: #33231f; border: 1px solid #5a2a24; color: #f0c8c0;
  padding: 10px 14px; border-radius: 8px; font-size: 13px; z-index: 30;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toast.show { opacity: 1; }
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f4f0; --card: #ffffff; --card2: #f0ede7; --line: #e0dcd4;
    --text: #23201b; --muted: #6d675e; --dim: #948d81; --accent: #b87514;
    --accent-dim: #f3e2c4;
  }
  .tab.active { color: #fff; }
  .chip { background: #faf9f6; }
  .addwrap input { color: var(--text); }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>famagic</h1>
    <span class="family" id="family"></span>
    <span class="status"><span class="dot" id="dot"></span><span id="status"></span></span>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main>
  <section>
    <h2>Aufgaben</h2>
    <div id="open"></div>
    <div id="doneWrap"></div>
  </section>
  <section id="shoppingSection" hidden>
    <h2>Einkaufslisten</h2>
    <div id="shopping"></div>
  </section>
</main>
<div class="addbar">
  <form class="addwrap" id="addForm">
    <input id="addInput" placeholder="Neue Aufgabe …" autocomplete="off" enterkeyhint="done">
    <button type="submit" aria-label="Hinzufügen">+</button>
  </form>
</div>
<div class="sheet-bg" id="sheetBg">
  <div class="sheet">
    <h3 id="sheetTitle">Aufgabe bearbeiten</h3>
    <div class="field"><label for="fTitle">Titel</label><input id="fTitle" autocomplete="off"></div>
    <div class="field"><label for="fNotes">Notizen</label><textarea id="fNotes"></textarea></div>
    <div class="row2">
      <div class="field"><label for="fDue">Fällig am</label><input id="fDue" type="date"></div>
      <div class="field"><label for="fTime">Uhrzeit</label><input id="fTime" type="time"></div>
    </div>
    <div class="field"><label for="fPrio">Priorität</label>
      <select id="fPrio"><option value="normal">Normal</option><option value="high">Wichtig</option></select>
    </div>
    <div class="actions">
      <button class="btn danger" id="btnDelete">Löschen</button>
      <button class="btn" id="btnCancel">Abbrechen</button>
      <button class="btn primary" id="btnSave">Speichern</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const state = { snap: null, listId: null, doneOpen: false, edit: null, token: localStorage.getItem("famTok") || "" };

function api(path, opts = {}) {
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  if (state.token) headers.Authorization = "Bearer " + state.token;
  return fetch(path, Object.assign({}, opts, { headers })).then(async (r) => {
    if (r.status === 401) {
      const t = prompt("API-Token für famagic-sync:");
      if (t) { state.token = t; localStorage.setItem("famTok", t); return api(path, opts); }
      throw new Error("Nicht autorisiert");
    }
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || data.detail && JSON.stringify(data.detail) || ("HTTP " + r.status));
    return data;
  });
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 3500);
}

function fmtDue(dateStr) {
  if (!dateStr) return null;
  const [y, m, d] = dateStr.split("-").map(Number);
  const due = new Date(y, m - 1, d);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((due - today) / 86400000);
  if (diff === 0) return { text: "heute", cls: "due-today" };
  if (diff === 1) return { text: "morgen", cls: "due-today" };
  if (diff < 0) return { text: diff === -1 ? "gestern" : Math.abs(diff) + " Tage überfällig", cls: "due-overdue" };
  return { text: String(d).padStart(2, "0") + "-" + String(m).padStart(2, "0") + "-" + y, cls: "" };
}

function memberName(id) {
  const m = (state.snap.members || []).find((x) => x.id === id);
  if (!m) return "";
  if (m.first_name) return m.first_name;
  if (m.profile && m.profile.first_name) return m.profile.first_name;
  if (m.linked_user_id) {
    const p = (state.snap.profiles || []).find((x) => x.id === m.linked_user_id);
    if (p && p.first_name) return p.first_name;
  }
  return m.role || "";
}

function render() {
  const snap = state.snap;
  if (!snap) return;
  $("family").textContent = snap.family ? snap.family.name : "";
  const dot = $("dot");
  const pending = snap.pending || 0;
  dot.className = "dot" + (snap.error ? " err" : (snap.offline || pending ? " pending" : ""));
  if (snap.offline) {
    $("status").textContent = "online · " + pending + " warten";
  } else if (pending) {
    $("status").textContent = "online · " + pending + " werden gesendet";
  } else {
    $("status").textContent = snap.synced_at ? new Date(snap.synced_at).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) : "";
  }

  const lists = (snap.lists || []).filter((l) => !l.archived_at);
  if (!state.listId || !lists.find((l) => l.id === state.listId)) {
    const def = lists.find((l) => l.is_default && !l.is_private) || lists[0];
    state.listId = def ? def.id : null;
  }
  const tabs = $("tabs");
  tabs.innerHTML = "";
  for (const l of lists) {
    const b = document.createElement("button");
    b.className = "tab" + (l.id === state.listId ? " active" : "");
    b.textContent = l.title;
    b.onclick = () => { state.listId = l.id; state.doneOpen = false; render(); };
    tabs.appendChild(b);
  }

  const tasks = (snap.tasks || []).filter((t) => t.list_id === state.listId && !t.parent_task_id);
  const open = tasks.filter((t) => !t.is_completed);
  const done = tasks.filter((t) => t.is_completed);
  open.sort((a, b) => {
    const ad = a.due_date || "9999", bd = b.due_date || "9999";
    if (ad !== bd) return ad < bd ? -1 : 1;
    return (a.position || 0) - (b.position || 0);
  });
  done.sort((a, b) => (b.completed_at || "") < (a.completed_at || "") ? -1 : 1);

  const openEl = $("open");
  openEl.innerHTML = "";
  if (!open.length) openEl.innerHTML = '<div class="empty">Nichts offen. Sehr gut.</div>';
  for (const t of open) openEl.appendChild(taskRow(t));

  const doneWrap = $("doneWrap");
  doneWrap.innerHTML = "";
  if (done.length) {
    const more = document.createElement("button");
    more.className = "more";
    more.textContent = (state.doneOpen ? "▾ " : "▸ ") + "Erledigt (" + done.length + ")";
    more.onclick = () => { state.doneOpen = !state.doneOpen; render(); };
    doneWrap.appendChild(more);
    if (state.doneOpen) for (const t of done) doneWrap.appendChild(taskRow(t));
  }

  const shop = (snap.shopping_lists || []).filter((l) => !l.is_private || l.created_by_user_id === snap.me);
  const shopEl = $("shopping");
  if (shop.length) {
    $("shoppingSection").hidden = false;
    shopEl.innerHTML = "";
    for (const sl of shop) {
      const h = document.createElement("div");
      h.className = "more";
      h.style.marginTop = "8px";
      h.style.display = "flex";
      h.style.justifyContent = "space-between";
      const name = document.createElement("span");
      name.textContent = sl.title;
      const add = document.createElement("button");
      add.className = "more";
      add.textContent = "+";
      add.title = "Eintrag hinzufügen";
      add.onclick = async () => {
        const v = prompt("Was fehlt?");
        if (!v || !v.trim()) return;
        try {
          await api("/api/shopping/items", { method: "POST", body: JSON.stringify({ list_id: sl.id, name: v.trim() }) });
          setTimeout(refresh, 300);
        } catch (e) { toast(e.message); }
      };
      h.appendChild(name);
      h.appendChild(add);
      shopEl.appendChild(h);
      const items = (sl.items || []).filter((i) => !i.is_checked);
      if (!items.length) {
        const e = document.createElement("div");
        e.className = "empty";
        e.textContent = "leer";
        shopEl.appendChild(e);
      }
      for (const it of items) {
        const el = document.createElement("div");
        el.className = "task";
        el.innerHTML = '<span class="check"></span><div class="body"><div class="title"></div></div>';
        el.querySelector(".title").textContent = it.name + (it.quantity_text ? "  ·  " + it.quantity_text : "");
        el.querySelector(".check").onclick = async (ev) => {
          ev.stopPropagation();
          try {
            await api("/api/shopping/items/" + it.id, { method: "PATCH", body: JSON.stringify({ is_checked: true }) });
            setTimeout(refresh, 300);
          } catch (e) { toast(e.message); }
        };
        el.onclick = async () => {
          const v = prompt("Eintrag ändern", it.name);
          if (v === null) return;
          if (!v.trim()) return;
          try {
            await api("/api/shopping/items/" + it.id, { method: "PATCH", body: JSON.stringify({ name: v.trim() }) });
            setTimeout(refresh, 300);
          } catch (e) { toast(e.message); }
        };
        shopEl.appendChild(el);
      }
    }
  } else {
    $("shoppingSection").hidden = true;
  }
}

function taskRow(t) {
  const el = document.createElement("div");
  el.className = "task" + (t.is_completed ? " done" : "");
  const meta = [];
  const due = fmtDue(t.due_date);
  let metaHtml = "";
  if (due) metaHtml += '<span class="chip ' + due.cls + '">' + due.text + (t.due_time ? " · " + t.due_time.slice(0, 5) : "") + "</span>";
  if (t.priority === "high") metaHtml += '<span class="chip prio">wichtig</span>';
  if (t.recurrence_rule) metaHtml += '<span class="chip">Serie</span>';
  const names = (t.assignee_member_ids || []).map(memberName).filter(Boolean);
  if (names.length) metaHtml += '<span class="chip">' + names.join(", ") + "</span>";
  el.innerHTML = '<button class="check' + (t.is_completed ? " on" : "") + '" aria-label="abhaken"></button>' +
    '<div class="body"><div class="title"></div>' + (metaHtml ? '<div class="meta">' + metaHtml + "</div>" : "") + "</div>";
  el.querySelector(".title").textContent = t.title;
  el.querySelector(".check").onclick = async (ev) => {
    ev.stopPropagation();
    el.style.opacity = ".5";
    try {
      await api("/api/tasks/" + t.id + "/complete", { method: "POST", body: JSON.stringify({ completed: !t.is_completed }) });
      t.is_completed = !t.is_completed;
      setTimeout(refresh, 300);
    } catch (e) {
      el.style.opacity = "1";
      toast(e.message);
    }
  };
  el.onclick = () => openEdit(t);
  return el;
}

function openEdit(t) {
  state.edit = t;
  $("sheetTitle").textContent = "Aufgabe bearbeiten";
  $("fTitle").value = t.title || "";
  $("fNotes").value = t.notes || "";
  $("fDue").value = t.due_date || "";
  $("fTime").value = t.due_time ? t.due_time.slice(0, 5) : "";
  $("fPrio").value = t.priority === "high" ? "high" : "normal";
  $("sheetBg").classList.add("open");
}

function closeSheet() {
  $("sheetBg").classList.remove("open");
  state.edit = null;
}

$("sheetBg").onclick = (e) => { if (e.target === $("sheetBg")) closeSheet(); };
$("btnCancel").onclick = closeSheet;
$("btnSave").onclick = async () => {
  const t = state.edit;
  if (!t) return;
  const body = {
    title: $("fTitle").value.trim(),
    notes: $("fNotes").value.trim(),
    due_date: $("fDue").value || null,
    due_time: $("fTime").value || null,
    priority: $("fPrio").value,
  };
  if (!body.title) { toast("Titel fehlt"); return; }
  try {
    await api("/api/tasks/" + t.id, { method: "PATCH", body: JSON.stringify(body) });
    closeSheet();
    setTimeout(refresh, 300);
  } catch (e) { toast(e.message); }
};
$("btnDelete").onclick = async () => {
  const t = state.edit;
  if (!t) return;
  if (!confirm("Aufgabe löschen?")) return;
  try {
    await api("/api/tasks/" + t.id, { method: "DELETE" });
    closeSheet();
    setTimeout(refresh, 300);
  } catch (e) { toast(e.message); }
};

$("addForm").onsubmit = async (ev) => {
  ev.preventDefault();
  const input = $("addInput");
  const title = input.value.trim();
  if (!title || !state.listId) return;
  input.value = "";
  try {
    await api("/api/tasks", { method: "POST", body: JSON.stringify({ list_id: state.listId, title }) });
    setTimeout(refresh, 300);
  } catch (e) { input.value = title; toast(e.message); }
};

let refreshTimer = null;
function scheduleRefresh() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(refresh, 250);
}

async function refresh() {
  try {
    state.snap = await api("/api/snapshot");
    render();
  } catch (e) {
    const dot = $("dot");
    dot.className = "dot err";
    $("status").textContent = "offline";
  }
}

function connectEvents() {
  try {
    const es = new EventSource("/api/events" + (state.token ? "?token=" + encodeURIComponent(state.token) : ""));
    es.addEventListener("update", scheduleRefresh);
    es.onerror = () => { es.close(); setTimeout(connectEvents, 5000); };
  } catch (e) { setTimeout(connectEvents, 5000); }
}

refresh();
connectEvents();
setInterval(refresh, 30000);
</script>
</body>
</html>
